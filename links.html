<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI in Practice</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--text:#18181b;--muted:#6b6b73;--accent:#4f46e5;--border:#e4e2db;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121214;--card:#1c1c20;--text:#f4f4f5;--muted:#9a9aa3;--accent:#8b85ff;--border:#2c2c32}}
:root[data-theme="dark"]{--bg:#121214;--card:#1c1c20;--text:#f4f4f5;--muted:#9a9aa3;--accent:#8b85ff;--border:#2c2c32}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;justify-content:center}
main{width:100%;max-width:460px;padding:56px 20px 40px;text-align:center}
.avatar{width:88px;height:88px;border-radius:50%;background:var(--accent);color:#fff;font-size:36px;font-weight:700;display:grid;place-items:center;margin:0 auto 16px}
h1{font-size:24px;margin:0 0 6px}
.bio{color:var(--muted);margin:0 0 32px;font-size:15px;line-height:1.5}
a.link{display:flex;align-items:center;gap:14px;text-align:left;text-decoration:none;color:var(--text);background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px 18px;margin-bottom:14px;transition:transform .15s,border-color .15s}
a.link:hover{transform:translateY(-2px);border-color:var(--accent)}
.ico{font-size:26px;width:44px;height:44px;border-radius:12px;background:var(--bg);display:grid;place-items:center;flex:none}
.t{font-weight:600;font-size:16px}
.d{color:var(--muted);font-size:13px;margin-top:2px}
.arrow{margin-left:auto;color:var(--muted)}
footer{margin-top:28px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<main>
  <!-- EDIT: your name, bio, and the 3 links below -->
  <div class="avatar">AI</div>
  <h1>AI in Practice</h1>
  <p class="bio">Practical tools and learning resources for APT.</p>

  <a class="link" href="https://xp3nus.github.io/apt-priceestimator/" target="_blank" rel="noopener">
    <span class="ico">🌐</span>
    <span><div class="t">APT Price Estimator</div><div class="d">Estimate the usage fee of our facility</div></span>
    <span class="arrow">→</span>
  </a>

  <a class="link" href="https://xp3nus.github.io/learn_apt_in_8lessons_zh/#lesson-1" target="_blank" rel="noopener">
    <span class="ico">🚀</span>
    <span><div class="t">Learn APT in 8 Lessons</div><div class="d">Step-by-step course with visuals</div></span>
    <span class="arrow">→</span>
  </a>

  <a class="link" href="https://github.com/xp3nus" target="_blank" rel="noopener">
    <span class="ico">💻</span>
    <span><div class="t">GitHub</div><div class="d">Source code &amp; projects</div></span>
    <span class="arrow">→</span>
  </a>

  <footer>© 2026 Wong Zhong Han</footer>
</main>
</body>
</html>
